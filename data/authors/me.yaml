bio: |
  Pouya Hosseini received his B.Sc. degree in Electrical Engineering from Yasouj University, Kohgiluyeh and Boyer-Ahmad Province, Iran, in 2023, and his M.Sc. degree in Communication Systems Engineering from Yazd University, Yazd, Iran, in 2026.
  Since 2024, he has been a Research Assistant at the Wireless Networking Lab (WINEL), Yazd University.
  His research interests include energy-efficient integrated sensing, communication, and computing (ISAC/ISCC), optimization theory, federated learning (FL), and artificial intelligence (AI) for wireless communications.
