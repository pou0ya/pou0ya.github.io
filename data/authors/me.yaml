  - role: "Undergraduate Researcher"
    org: "Yasouj University"
    start: "2022-06-01"
    end: "2023-01-31"
    summary: "Developed a new texture descriptor that improves the speed and accuracy of OD-LBP, a popular texture classification method. The new descriptor effectively captures unique texture features by considering the intensity difference between the center and surrounding pixels. Experimental results showed a significant 56.7% increase in processing speed and a 1% improvement in precision and recall rates. This work was published in the IEEE International Conference on Pattern Recognition and Image Analysis (IPRIA).\n"
  - role: "Undergraduate Researcher"
    org: "Engineering Intern"
    start: "2022-06-01"
    end: "2022-08-31"
    summary: "Gained practical experience operating telecommunication switches, such as the NEAX 61, using terminal commands under the guidance of senior engineers.\n"
